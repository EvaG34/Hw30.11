<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 01</title>
</head>
/*
        Задание:
        Сделайте так, чтобы класс Truck наследовался от класса Car.
        Переопределит метод move, чтобы в производном классе он выводил сообщение, "Грузовик движется со скоростью 50 км/час".
        */
<body>
    <script>

        class Car {
            start() {
                console.log("Двигун увімкнено");
            }

            move() {
                console.log("Машина їде зі швидкістю 80 км/год");
            }
        }

        class Truck extends Car{
            weight;
            loadCargo(weight) {
                if (weight > 1000) {
                    console.log("Цей грузовік не може везти більше 1000кг груза");
                }
                else {
                    this.weight = weight;
                    console.log(`В грузовік загружено ${this.weight}кг.`);
                }
            }
            move() {
                console.log("Грузовик движется со скоростью 50 км/час");
            }
        }

        let v1 = new Car();
        v1.start();
        v1.move();

        let v2 = new Truck();
        v2.loadCargo(1500);
        v2.loadCargo(990);
        v2.start();
        v2.move();
    </script>
</body>

</html>
